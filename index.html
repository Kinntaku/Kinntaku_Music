<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Musiclib</title>
</head>

<body>

    <h1>Musiclib</h1>

    <div>
        <p id="current-track">Music List</p>
        <audio id="audio-player" controls></audio>
        <p>
            <button id="copy-link-btn" style="display: none;">Copy Link</button>
            <span id="copy-status" style="margin-left: 10px; color: green;"></span>
        </p>
    </div>

    <hr>

    <ul id="playlist">
        <li>Loading files...</li>
    </ul>

    <script>
        const playlistElement = document.getElementById('playlist');
        const audioPlayer = document.getElementById('audio-player');
        const currentTrackDiv = document.getElementById('current-track');
        const copyLinkBtn = document.getElementById('copy-link-btn');
        const copyStatus = document.getElementById('copy-status');

        const allowedExtensions = ['.mp3', '.ogg', '.flac'];

        // 1. 自动解析当前 Pages 所在的用户名和仓库名
        const host = window.location.host;
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const user = host.split('.')[0];
        const repo = pathSegments[0] || '';

        // 2. 请求当前仓库根目录的文件列表
        const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents`;

        // 临时存储当前播放歌曲的完整直链
        let currentAbsoluteUrl = "";

        async function fetchMusic() {
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Failed to read files, please ensure the repository is public and Pages is enabled');
                const files = await response.json();

                // 过滤出音频文件
                const audioFiles = files.filter(file => {
                    if (file.type !== 'file') return false;
                    const nameLower = file.name.toLowerCase();
                    return allowedExtensions.some(ext => nameLower.endsWith(ext));
                });

                if (audioFiles.length === 0) {
                    playlistElement.innerHTML = '<li>No audio files found</li>';
                    return;
                }

                // 3. 生成列表
                playlistElement.innerHTML = '';
                audioFiles.forEach(track => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = "#";
                    a.textContent = track.name;

                    // 核心：使用 Pages 的相对路径
                    const relativeUrl = `./${encodeURIComponent(track.name)}`;

                    a.addEventListener('click', (e) => {
                        e.preventDefault();

                        // 播放器加载相对路径
                        audioPlayer.src = relativeUrl;
                        audioPlayer.play();

                        currentTrackDiv.innerHTML = `Playing: <strong>${track.name}</strong>`;

                        // 核心修改：利用 URL 对象将相对路径转换为绝对直链地址
                        currentAbsoluteUrl = new URL(relativeUrl, window.location.href).href;

                        // 显示复制按钮并重置提示文字
                        copyLinkBtn.style.display = 'inline';
                        copyStatus.textContent = '';
                    });

                    li.appendChild(a);
                    playlistElement.appendChild(li);
                });

            } catch (error) {
                playlistElement.innerHTML = `<li style="color: red;">Error: ${error.message}</li>`;
            }
        }

        // 4. 复制到剪贴板的逻辑
        copyLinkBtn.addEventListener('click', () => {
            if (!currentAbsoluteUrl) return;

            // 使用现代浏览器标准的 Clipboard API 复制文本
            navigator.clipboard.writeText(currentAbsoluteUrl).then(() => {
                copyStatus.textContent = "Copied!";
                // 2秒后自动清除提示
                setTimeout(() => {
                    copyStatus.textContent = "";
                }, 2000);
            }).catch(err => {
                console.error('复制失败: ', err);
                copyStatus.textContent = "Failed to copy, please copy manually";
            });
        });

        fetchMusic();
    </script>

</body>

</html>
